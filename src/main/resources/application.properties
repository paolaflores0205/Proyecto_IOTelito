spring.application.name=taxiweb

# Base MySQL creada con db/00-crear-base.sql, db/schema.sql y db/data.sql.
# Credenciales solo por variables de entorno (nunca en el repositorio):
#   DB_URL, DB_USER, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/iotelito?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# El script db/schema.sql manda: Hibernate solo comprueba que las entidades coincidan.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=never

# API REST: tokens de Firebase de este proyecto (el mismo de la app).
iotelito.firebase.project-id=${FIREBASE_PROJECT_ID:iot-telito}

# Cuentas automáticas de taxistas al aprobar: ruta al .json de la cuenta de servicio (fuera del
# repo) y la clave web pública del proyecto (la de google-services.json, para el correo de
# contraseña). Sin la ruta, las cuentas se crean a mano en la consola de Firebase.
iotelito.firebase.credenciales=${IOTELITO_FIREBASE_CREDENCIALES:}
iotelito.firebase.web-api-key=${IOTELITO_FIREBASE_WEB_API_KEY:}

# Contraseña del superadmin en producción: IOTELITO_ADMIN_PASSWORD (12 caracteres o más).
# Ver AdminInicialConfig. Sin la variable se usa la cuenta de data.sql.

spring.thymeleaf.cache=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=9MB

iotelito.taxistas.s3.bucket=${TAXI_DOCS_BUCKET:}
iotelito.taxistas.s3.region=${TAXI_DOCS_REGION:us-east-1}

server.port=8080
