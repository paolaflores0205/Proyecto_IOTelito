# Pruebas: H2 en memoria en modo MySQL con los mismos scripts que se entregan.
# Si schema.sql y las entidades no coinciden, ddl-auto=validate hace fallar las pruebas.
spring.datasource.url=jdbc:h2:mem:iotelito_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.sql.init.mode=always
spring.sql.init.schema-locations=file:db/schema.sql
spring.sql.init.data-locations=file:db/data.sql

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
