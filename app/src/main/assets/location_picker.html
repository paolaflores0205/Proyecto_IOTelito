<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        html, body, #map { width: 100%; height: 100%; margin: 0; padding: 0; }
        .leaflet-control-attribution { font-size: 10px; }
    </style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const params = new URLSearchParams(window.location.search);
    const latitude = Number.parseFloat(params.get('lat')) || -12.0464;
    const longitude = Number.parseFloat(params.get('lng')) || -77.0428;
    const map = L.map('map', { zoomControl: true }).setView([latitude, longitude], 16);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    function reportCenter() {
        const center = map.getCenter();
        if (window.Android && window.Android.onMapMoved) {
            window.Android.onMapMoved(center.lat, center.lng);
        }
    }

    map.on('move', reportCenter);
    map.on('moveend', reportCenter);
    reportCenter();
</script>
</body>
</html>
